[project]
name = "ccsessions-tui"
version = "0.2.1"
description = "Terminal UI for browsing, previewing, resuming and managing Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marek Miśkiewicz" },
]
keywords = ["claude", "claude-code", "sessions", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/miskiewiczm/ccsessions"
Issues = "https://github.com/miskiewiczm/ccsessions/issues"

[project.scripts]
ccsessions = "ccsessions.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccsessions"]
